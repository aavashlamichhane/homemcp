# Hardened homemcp gateway + read-only docker-socket-proxy stack.
# Place at /opt/homemcp/gateway/docker-compose.yml with .env (0600) and config/homemcp.config.yaml.
services:
  homemcp-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:961b21f7b0a75f0507943095f97e61a96883180b9a9c2879f482b6f3574f3870
    container_name: homemcp-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      EVENTS: "1"
      SYSTEM: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homemcp_internal
    mem_limit: 64m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  homemcp:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    image: homemcp-gateway:latest
    container_name: homemcp
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${HOMEMCP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - /run/homemcpd:/run/homemcpd
    networks:
      - homemcp_internal
      - cloudflared_default
      - proxy
    depends_on:
      - homemcp-socket-proxy

networks:
  homemcp_internal:
    internal: true
  cloudflared_default:
    external: true
  proxy:
    external: true
